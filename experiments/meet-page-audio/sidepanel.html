<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuelo audio check</title><link rel="stylesheet" href="sidepanel.css"></head><body><header><strong>Cuelo</strong><span>Audio check · No AI</span></header><main><h1>Check audio inside Meet.</h1><p>No sharing picker. No recording. No answers are generated.</p><p id="status" role="status">Checking your meeting…</p><div id="setup" hidden><label for="source">Test source</label><select id="source"><option value="">Choose the test source</option><option value="sample">Audio check sample — no document or AI connected</option></select><button id="start" disabled>Start</button></div><section id="levels" hidden><label for="meeting">Meeting audio candidate</label><meter id="meeting" min="0" max="1" value="0"></meter><p id="tracks"></p><label for="microphone">Your microphone</label><meter id="microphone" min="0" max="1" value="0"></meter><p id="mute"></p><p>Use headphones. Confirm only the meeting meter moves when another participant speaks, and only your microphone meter moves when you speak.</p><button id="pause">Pause</button></section><button id="stop" hidden>Stop</button><p id="warning" hidden>Five minutes remain.</p><p id="error" role="alert"></p></main><script src="sidepanel.js"></script></body></html>
